name: Weekly Crime Data Update

on:
  schedule:
    # 每周一 UTC 06:00 运行（北京时间周一下午 2 点）
    - cron: '0 6 * * 1'
  # 允许手动触发，方便测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape crime data
        run: npm run scrape:crime
        env:
          CI: true

      - name: Build crime summary
        run: npm run build:summary

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/crime-data/
          if git diff --staged --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "chore: weekly crime data update $(date -u +'%Y-%m-%d')"
            git push
          fi
